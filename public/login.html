<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – PMO Hub</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<style>
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
  [hidden]{display:none!important}h1{margin:0;font-size:20px}
  button,input{font:inherit;color:inherit}
  input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;width:100%}
  input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm)}
  button:hover{background:var(--surface-2)}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main class="login-page">
  <form class="login-card" id="form" novalidate>
    <img class="logo" src="logo.png" alt="Company logo">
    <h1>Sign in to PMO Hub</h1>
    <div id="msg" class="msg err" role="alert" hidden></div>
    <label>Email<input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" id="submit" type="submit">Sign in</button>
    <div class="divider">or</div>
    <button type="button" id="sso">Sign in with SSO</button>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
