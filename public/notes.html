<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes – PMO Hub</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>
<div class="shell">
<aside class="side" id="side"></aside>
<div class="content">
<header class="top">
  <h1>Notes</h1>
  <div class="top-actions">
    <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
    <button id="btn-today">Today</button>
  </div>
</header>
<main class="journal">
  <section class="panel cal" aria-label="Calendar">
    <div class="cal-head">
      <button id="cal-prev" aria-label="Previous month">‹</button>
      <h2 id="cal-title" aria-live="polite"></h2>
      <button id="cal-next" aria-label="Next month">›</button>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
    <p class="cal-legend muted"><span class="cal-dot" aria-hidden="true"></span> A day with notes</p>
    <p class="muted private"><small>Your notes are private to you. They are stored with the rest of PMO Hub's data, so anyone with access to the database could read them.</small></p>
  </section>

  <section class="panel day" aria-label="Notes for the selected day">
    <div class="day-head">
      <div>
        <h2 id="day-title" class="day-title"></h2>
        <div id="day-sub" class="muted"></div>
      </div>
      <input id="search" type="search" placeholder="Search all notes…" aria-label="Search all notes">
    </div>
    <div class="day-body" id="day-body"></div>
  </section>
</main>
</div>
</div>
<script src="local-api.js"></script>
<script src="file-sync.js"></script>
<script src="status.js"></script>
<script src="shell.js"></script>
<script src="notes.js"></script>
</body>
</html>
